name: PS PlayAnywhere Android release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-release.yml']

concurrency: ps-playanywhere-android-release

jobs:
  android:
    uses: ./.github/workflows/android-baseline.yml
    with:
      integration: true
    permissions:
      contents: read
  publish:
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps-playanywhere-debug-integration-${{ github.run_attempt }}
          path: artifact
      - name: Sign with the PS PlayAnywhere update key
        working-directory: artifact
        env:
          KEYSTORE_B64: ${{ secrets.PSPA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PSPA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PSPA_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PSPA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          : "${KEYSTORE_B64:?PS PlayAnywhere signing keystore is required}"
          : "${STORE_PASSWORD:?}" "${KEY_PASSWORD:?}" "${KEY_ALIAS:?}"
          key=$(mktemp "$RUNNER_TEMP/pspa-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key"
          apk=engine/chiaki/android/app/build/outputs/apk/debug/app-debug.apk
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          sha256sum --check SHA256SUMS.txt
          "$signer" sign --ks "$key" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out signed.apk "$apk"
          expected=33472559109d7d74c7566402781cc6a9a92e963f465b66832644c3828b1d7c5e
          certs=$("$signer" verify --print-certs signed.apk)
          actual=$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' <<< "$certs")
          [[ "$actual" == "$expected" ]] || { echo "Release signer differs from v0.1.9"; exit 1; }
      - name: Publish latest debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifact
          sha256sum --check SHA256SUMS.txt
          grep -F "versionCode='10' versionName='0.1.9'" apk-badging.txt
          cp signed.apk PS-PlayAnywhere-0.1.9-debug.apk
          sha256sum PS-PlayAnywhere-0.1.9-debug.apk > PS-PlayAnywhere-0.1.9-SHA256.txt
          cat > release-notes.md <<'NOTES'
          Android debug build for physical testing.

          - Choose 720p, 1080p or saved video settings before starting a PS5 stream. Each paired PS5 remembers its own resolution choice.
          - Preview the requested source resolution, FPS and target bitrate before connecting. The source FPS updates when frame generation is toggled.
          - The GPU midpoint shader skips motion sampling for unchanged pixels and skips warping where motion confidence is zero. Live GPU performance still needs phone testing.

          The release workflow requires the signing certificate used for v0.1.9.
          NOTES
          gh release create v0.1.9 PS-PlayAnywhere-0.1.9-debug.apk PS-PlayAnywhere-0.1.9-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PS PlayAnywhere 0.1.9 (Android debug)" --notes-file release-notes.md --latest
