name: PS PlayAnywhere Android release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-release.yml']

concurrency: ps-playanywhere-android-release

jobs:
  android:
    uses: ./.github/workflows/android-baseline.yml
    with:
      integration: true
    permissions:
      contents: read
  publish:
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps-playanywhere-debug-integration-${{ github.run_attempt }}
          path: artifact
      - name: Publish latest debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifact
          sha256sum --check SHA256SUMS.txt
          grep -F "versionCode='6' versionName='0.1.5'" apk-badging.txt
          cp engine/chiaki/android/app/build/outputs/apk/debug/app-debug.apk PS-PlayAnywhere-0.1.5-debug.apk
          sha256sum PS-PlayAnywhere-0.1.5-debug.apk > PS-PlayAnywhere-0.1.5-SHA256.txt
          cat > release-notes.md <<'NOTES'
          Android debug build for physical testing.

          - Adds experimental 30 → 60 FPS frame generation on the phone. Set the Remote Play stream to 30 FPS and turn on frame generation from the in-stream menu. The switch defaults to off and changing it reconnects the stream.
          - Adds Display only mode, which hides the touch controls and stops sending input from the phone while streaming continues.
          - Android build and unit tests passed in CI. Frame pacing, latency, visual artifacts and direct DualSense play still need a physical PS5 and phone test.

          Android requires matching signing certificates for an in-place update. This CI debug APK may have a different certificate from an earlier build. Uninstalling an existing copy removes its local data.
          NOTES
          gh release create v0.1.5 PS-PlayAnywhere-0.1.5-debug.apk PS-PlayAnywhere-0.1.5-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PS PlayAnywhere 0.1.5 (Android debug)" --notes-file release-notes.md --latest
