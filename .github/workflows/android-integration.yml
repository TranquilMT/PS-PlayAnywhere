name: VYNUVO Android integration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-integration.yml'
      - 'android/**'
      - 'engine/chiaki'
      - '.gitmodules'
      - 'build-support/**'
jobs:
  android:
    uses: ./.github/workflows/android-baseline.yml
    with:
      integration: true
  platform-navigation:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ps-playanywhere-debug-integration-${{ github.run_attempt }}
          path: ci-apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Exercise platform navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install ci-apk/engine/chiaki/android/app/build/outputs/apk/debug/app-debug.apk
            python3 tools/check-platform-hub.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-screens
          path: platform-screens/*.png
          if-no-files-found: ignore
