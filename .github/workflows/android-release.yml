name: VYNUVO Android release
on:
  workflow_dispatch:

concurrency: ps-playanywhere-android-release

jobs:
  android:
    uses: ./.github/workflows/android-baseline.yml
    with:
      integration: true
    permissions:
      contents: read
  publish:
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps-playanywhere-debug-integration-${{ github.run_attempt }}
          path: artifact
      - name: Sign with the existing Android update key
        working-directory: artifact
        env:
          KEYSTORE_B64: ${{ secrets.PSPA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PSPA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PSPA_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PSPA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          : "${KEYSTORE_B64:?Android signing keystore is required}"
          : "${STORE_PASSWORD:?}" "${KEY_PASSWORD:?}" "${KEY_ALIAS:?}"
          key=$(mktemp "$RUNNER_TEMP/pspa-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key"
          apk=engine/chiaki/android/app/build/outputs/apk/debug/app-debug.apk
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          sha256sum --check SHA256SUMS.txt
          "$signer" sign --ks "$key" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out signed.apk "$apk"
          expected=2bb881c791a9fdb5c5ad212336818df9817b7daefa957c8c729768e299663407
          certs=$("$signer" verify --print-certs signed.apk)
          actual=$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' <<< "$certs")
          [[ "$actual" == "$expected" ]] || { echo "Release signer differs from v0.1.12"; exit 1; }
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: source
      - name: Publish VYNUVO Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artifact
          sha256sum --check SHA256SUMS.txt
          grep -F "versionCode='16' versionName='0.1.15'" apk-badging.txt
          cp signed.apk VYNUVO-0.1.15.apk
          (cd ../source && bash tools/archive-source.sh ../artifact/VYNUVO-0.1.15-source.tar.gz)
          sha256sum VYNUVO-0.1.15.apk VYNUVO-0.1.15-source.tar.gz > VYNUVO-0.1.15-SHA256.txt
          gh release create v0.1.15 VYNUVO-0.1.15.apk VYNUVO-0.1.15-source.tar.gz VYNUVO-0.1.15-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "VYNUVO 0.1.15 (Android preview)" --notes-file ../source/docs/RELEASE-0.1.15.md --latest
