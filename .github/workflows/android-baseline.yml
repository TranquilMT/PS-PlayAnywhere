name: Android native baseline (upstream Chiaki)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-baseline.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout PS PlayAnywhere
        uses: actions/checkout@v4
      - name: Checkout upstream Chiaki native client
        uses: actions/checkout@v4
        with:
          repository: chiaki-ng/chiaki-ng
          ref: 43728af2e639fecb8a7af1cd68c29820a40de973
          path: upstream
          submodules: recursive
      - name: Verify pinned upstream revision
        run: |
          actual="$(git -C upstream rev-parse HEAD)"
          expected="43728af2e639fecb8a7af1cd68c29820a40de973"
          echo "$actual" | tee upstream-commit.txt
          test "$actual" = "$expected"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native toolchain using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          printf 'y\\n' | "$SDKMANAGER" --licenses > /tmp/android-licenses.log || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$SDKMANAGER" --list_installed
      - name: Install and test host Protocol Buffers toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler python3-protobuf
          protoc --version
          /usr/bin/python3 -c 'import google.protobuf; print(google.protobuf.__version__)'

          proto_dir="$GITHUB_WORKSPACE/upstream/lib/protobuf"
          generated_dir="$(mktemp -d)"
          trap 'rm -rf "$generated_dir"' EXIT
          protoc --proto_path="$proto_dir" --descriptor_set_out="$generated_dir/takion.pb" "$proto_dir/takion.proto"
          cd "$generated_dir"
          /usr/bin/python3 "$GITHUB_WORKSPACE/upstream/third-party/nanopb/generator/nanopb_generator.py" takion.pb
          test -s takion.pb.c
          test -s takion.pb.h
      - name: Install verified Gradle 8.11.1
        run: |
          grep -F 'gradle-8.11.1-bin.zip' upstream/android/gradle/wrapper/gradle-wrapper.properties
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            --output gradle-8.11.1-bin.zip
          printf '%s  %s\n' f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6 gradle-8.11.1-bin.zip |
            sha256sum --check
          unzip -q gradle-8.11.1-bin.zip
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - name: Build upstream Android debug APK
        working-directory: upstream/android
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Record resolved Android runtime dependencies
        working-directory: upstream/android
        run: gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon > "$GITHUB_WORKSPACE/android-runtime-dependencies.txt"
      - name: Verify APK and record SHA-256
        run: |
          apk=upstream/android/app/build/outputs/apk/debug/app-debug.apk
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$apk"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt" dump badging "$apk" > apk-badging.txt
          grep -F "package: name='com.metallic.chiaki'" apk-badging.txt
          grep -E "^native-code: .*'arm64-v8a'" apk-badging.txt
          sha256sum "$apk" | tee SHA256SUMS.txt
      - name: Upload APK and provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-android-baseline-debug
          path: |
            upstream/android/app/build/outputs/apk/debug/*.apk
            upstream-commit.txt
            SHA256SUMS.txt
            apk-badging.txt
            android-runtime-dependencies.txt
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-baseline-build-diagnostics
          path: |
            upstream/android/app/build/reports/
            upstream/android/.gradle/
          if-no-files-found: ignore
