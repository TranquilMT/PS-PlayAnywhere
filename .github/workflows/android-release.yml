name: PS PlayAnywhere Android release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-release.yml']

concurrency: ps-playanywhere-android-release

jobs:
  android:
    uses: ./.github/workflows/android-baseline.yml
    with:
      integration: true
    permissions:
      contents: read
  publish:
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps-playanywhere-debug-integration-${{ github.run_attempt }}
          path: artifact
      - name: Publish latest debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifact
          sha256sum --check SHA256SUMS.txt
          grep -F "versionCode='9' versionName='0.1.8'" apk-badging.txt
          cp engine/chiaki/android/app/build/outputs/apk/debug/app-debug.apk PS-PlayAnywhere-0.1.8-debug.apk
          sha256sum PS-PlayAnywhere-0.1.8-debug.apk > PS-PlayAnywhere-0.1.8-SHA256.txt
          cat > release-notes.md <<'NOTES'
          Android debug build for physical testing.

          - GPU frame generation now estimates larger movements and refines their direction in three passes within the motion shader. Pixels with inconsistent motion lean toward the decoded image to limit double edges.
          - Redesigned the streaming options panel and remembered the last options used to start a session.
          - Verified midpoint image synthesis on a synthetic pan with the actual shaders on desktop Mesa. Device performance and game footage still need testing.

          Android requires matching signing certificates for an in-place update. This CI debug APK may have a different certificate from an earlier build. Uninstalling an existing copy removes its local data.
          NOTES
          gh release create v0.1.8 PS-PlayAnywhere-0.1.8-debug.apk PS-PlayAnywhere-0.1.8-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PS PlayAnywhere 0.1.8 (Android debug)" --notes-file release-notes.md --latest
