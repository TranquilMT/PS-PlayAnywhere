name: Android native baseline (upstream Chiaki)
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      integration:
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/android-baseline.yml'
      - 'build-support/**'
jobs:
  build:
    name: Android build (${{ matrix.sample }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_DIR: ${{ matrix.sample == 'integration' && 'engine/chiaki' || 'upstream' }}
      APP_ID: ${{ matrix.sample == 'integration' && 'com.tranquil.ps5remoteplay' || 'com.metallic.chiaki' }}
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(inputs.integration && '["integration"]' || '["reference","repeat"]') }}
    steps:
      - name: Checkout PS PlayAnywhere
        uses: actions/checkout@v4
        with:
          submodules: ${{ matrix.sample == 'integration' && 'recursive' || 'false' }}
      - name: Checkout upstream Chiaki native client
        if: matrix.sample != 'integration'
        uses: actions/checkout@v4
        with:
          repository: chiaki-ng/chiaki-ng
          ref: 43728af2e639fecb8a7af1cd68c29820a40de973
          path: upstream
          submodules: recursive
      - name: Verify pinned upstream revision
        run: |
          actual="$(git -C "$SOURCE_DIR" rev-parse HEAD)"
          expected="43728af2e639fecb8a7af1cd68c29820a40de973"
          if [[ "$SOURCE_DIR" == "engine/chiaki" ]]; then
            expected="$(git rev-parse "HEAD:$SOURCE_DIR")"
          fi
          echo "$actual" | tee upstream-commit.txt
          test "$actual" = "$expected"
          git -C "$SOURCE_DIR" submodule status --recursive | tee upstream-submodules.txt
          ! grep -Eq '^[+-U]' upstream-submodules.txt
          # OpenSSL uses this timestamp when generating its build information.
          echo "SOURCE_DATE_EPOCH=$(git -C "$SOURCE_DIR" show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Enforce native and Gradle dependency checksums
        run: bash build-support/apply-dependency-pins.sh "$SOURCE_DIR"
      - name: Apply PS PlayAnywhere Android patches
        if: matrix.sample == 'integration'
        run: |
          git -C "$SOURCE_DIR" apply \
            "$GITHUB_WORKSPACE/android/patches/playanywhere-identity.patch" \
            "$GITHUB_WORKSPACE/android/patches/connection-help.patch"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native toolchain using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          printf 'y\\n' | "$SDKMANAGER" --licenses > /tmp/android-licenses.log || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$SDKMANAGER" --list_installed
      - name: Install and test host Protocol Buffers toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler python3-protobuf
          protoc --version
          /usr/bin/python3 -c 'import google.protobuf; print(google.protobuf.__version__)'

          proto_dir="$GITHUB_WORKSPACE/$SOURCE_DIR/lib/protobuf"
          generated_dir="$(mktemp -d)"
          trap 'rm -rf "$generated_dir"' EXIT
          protoc --proto_path="$proto_dir" --descriptor_set_out="$generated_dir/takion.pb" "$proto_dir/takion.proto"
          cd "$generated_dir"
          /usr/bin/python3 "$GITHUB_WORKSPACE/$SOURCE_DIR/third-party/nanopb/generator/nanopb_generator.py" takion.pb
          test -s takion.pb.c
          test -s takion.pb.h
      - name: Install verified Gradle 8.11.1
        run: |
          grep -F 'gradle-8.11.1-bin.zip' "$SOURCE_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            --output gradle-8.11.1-bin.zip
          printf '%s  %s\n' f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6 gradle-8.11.1-bin.zip |
            sha256sum --check
          unzip -q gradle-8.11.1-bin.zip
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - name: Build Android debug APK
        working-directory: ${{ env.SOURCE_DIR }}/android
        run: gradle :app:assembleDebug --dependency-verification strict --stacktrace --no-daemon
      - name: Run Android unit tests
        if: matrix.sample == 'integration'
        working-directory: ${{ env.SOURCE_DIR }}/android
        run: gradle :app:testDebugUnitTest --dependency-verification strict --stacktrace --no-daemon
      - name: Record resolved Android runtime dependencies
        working-directory: ${{ env.SOURCE_DIR }}/android
        run: gradle :app:dependencies --configuration debugRuntimeClasspath --dependency-verification strict --no-daemon > "$GITHUB_WORKSPACE/android-runtime-dependencies.txt"
      - name: Verify APK and record SHA-256
        run: |
          apk="$SOURCE_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$apk"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt" dump badging "$apk" > apk-badging.txt
          grep -F "package: name='$APP_ID'" apk-badging.txt
          grep -E "^native-code: .*'arm64-v8a'" apk-badging.txt
          sha256sum "$apk" | tee SHA256SUMS.txt
          /usr/bin/python3 - "$apk" > apk-payload-sha256.txt <<'PY'
          from hashlib import sha256
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as apk:
              for name in sorted(apk.namelist()):
                  print(f"{sha256(apk.read(name)).hexdigest()}  {name}")
          PY
      - name: Verify branded APK identity and 16 KB alignment
        if: matrix.sample == 'integration'
        run: |
          grep -F "application-label:'PS PlayAnywhere'" apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$SOURCE_DIR/android/app/build/outputs/apk/debug/app-debug.apk" res/layout/activity_main.xml > launcher-layout.txt
          grep -F '"com.metallic.chiaki.main.FloatingActionButtonBackgroundBehavior"' launcher-layout.txt
          grep -F '"com.metallic.chiaki.main.FloatingActionButtonSpeedDialBehavior"' launcher-layout.txt
          bash android/verify-arm64-alignment.sh "$SOURCE_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
      - name: Upload APK and provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.sample == 'integration' && 'ps-playanywhere-debug' || 'chiaki-android-baseline-debug' }}-${{ matrix.sample }}-${{ github.run_attempt }}
          path: |
            ${{ env.SOURCE_DIR }}/android/app/build/outputs/apk/debug/*.apk
            upstream-commit.txt
            upstream-submodules.txt
            SHA256SUMS.txt
            apk-badging.txt
            apk-payload-sha256.txt
            android-runtime-dependencies.txt
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-baseline-build-diagnostics-${{ matrix.sample }}-${{ github.run_attempt }}
          path: |
            ${{ env.SOURCE_DIR }}/android/app/build/reports/
            ${{ env.SOURCE_DIR }}/android/.gradle/
          if-no-files-found: ignore
