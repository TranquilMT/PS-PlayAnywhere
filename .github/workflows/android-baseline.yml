name: Android native baseline (upstream Chiaki)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-baseline.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout PS PlayAnywhere
        uses: actions/checkout@v4
      - name: Checkout upstream Chiaki native client
        uses: actions/checkout@v4
        with:
          repository: chiaki-ng/chiaki-ng
          ref: 43728af2e639fecb8a7af1cd68c29820a40de973
          path: upstream
          submodules: recursive
      - name: Verify pinned upstream revision
        run: |
          actual="$(git -C upstream rev-parse HEAD)"
          expected="43728af2e639fecb8a7af1cd68c29820a40de973"
          echo "$actual" | tee upstream-commit.txt
          test "$actual" = "$expected"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        uses: android-actions/setup-android@v3
      - name: Install native toolchain
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
          yes | sdkmanager --licenses || true
      - name: Validate Gradle wrapper checksum metadata
        run: |
          test -f upstream/android/gradle/wrapper/gradle-wrapper.jar
          test -f upstream/android/gradle/wrapper/gradle-wrapper.properties
          grep -F 'gradle-8.11.1-bin.zip' upstream/android/gradle/wrapper/gradle-wrapper.properties
      - name: Build upstream Android debug APK
        working-directory: upstream/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: SHA-256 checksum
        if: success()
        run: |
          find upstream/android/app/build/outputs/apk/debug -name '*.apk' -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt
      - name: Upload APK and provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-android-baseline-debug
          path: |
            upstream/android/app/build/outputs/apk/debug/*.apk
            upstream-commit.txt
            SHA256SUMS.txt
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-baseline-build-diagnostics
          path: |
            upstream/android/app/build/reports/
            upstream/android/.gradle/
          if-no-files-found: ignore
