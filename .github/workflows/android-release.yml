name: PS PlayAnywhere Android release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-release.yml']

concurrency: ps-playanywhere-android-release

jobs:
  android:
    uses: ./.github/workflows/android-baseline.yml
    with:
      integration: true
    permissions:
      contents: read
  publish:
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps-playanywhere-debug-integration-${{ github.run_attempt }}
          path: artifact
      - name: Publish latest debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifact
          sha256sum --check SHA256SUMS.txt
          grep -F "versionCode='7' versionName='0.1.6'" apk-badging.txt
          cp engine/chiaki/android/app/build/outputs/apk/debug/app-debug.apk PS-PlayAnywhere-0.1.6-debug.apk
          sha256sum PS-PlayAnywhere-0.1.6-debug.apk > PS-PlayAnywhere-0.1.6-SHA256.txt
          cat > release-notes.md <<'NOTES'
          Android debug build for physical testing.

          - Adds a refreshed Android launch screen and launcher icon, with PS PlayAnywhere branding on the console screen.
          - Shows Streaming options when you tap a paired PS5. Set 30 → 60 frame generation (beta) and Display only independently, then tap Start stream. Frame generation is intended for a 30 FPS source.
          - Reduces the size of the on-screen controller by approximately 10%.
          - Adds in-app instructions for testing 5G with a home VPN and existing PS5 pairing. Automatic PSN remote connection remains pending.
          - Android build and unit tests passed in CI. The new layout, frame pacing, and 5G streaming still need physical device testing.

          Android requires matching signing certificates for an in-place update. This CI debug APK may have a different certificate from an earlier build. Uninstalling an existing copy removes its local data.
          NOTES
          gh release create v0.1.6 PS-PlayAnywhere-0.1.6-debug.apk PS-PlayAnywhere-0.1.6-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PS PlayAnywhere 0.1.6 (Android debug)" --notes-file release-notes.md --latest
