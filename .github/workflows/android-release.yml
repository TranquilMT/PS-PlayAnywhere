name: PS PlayAnywhere Android release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-release.yml']

concurrency: ps-playanywhere-android-release

jobs:
  android:
    uses: ./.github/workflows/android-baseline.yml
    with:
      integration: true
    permissions:
      contents: read
  publish:
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps-playanywhere-debug-integration-${{ github.run_attempt }}
          path: artifact
      - name: Publish latest debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifact
          sha256sum --check SHA256SUMS.txt
          grep -F "versionCode='8' versionName='0.1.7'" apk-badging.txt
          cp engine/chiaki/android/app/build/outputs/apk/debug/app-debug.apk PS-PlayAnywhere-0.1.7-debug.apk
          sha256sum PS-PlayAnywhere-0.1.7-debug.apk > PS-PlayAnywhere-0.1.7-SHA256.txt
          cat > release-notes.md <<'NOTES'
          Android debug build for physical testing.

          - Shows a five-second branded loading screen on a fresh launch.
          - Frame generation now requests a 30 FPS source and schedules rendering from Android display callbacks. Each generated midpoint is followed by its real frame, with stale pairs skipped after stalls.
          - Reduces repeated OpenGL lookups and framebuffer validation during rendering. Physical frame pacing and latency measurements are pending.

          Android requires matching signing certificates for an in-place update. This CI debug APK may have a different certificate from an earlier build. Uninstalling an existing copy removes its local data.
          NOTES
          gh release create v0.1.7 PS-PlayAnywhere-0.1.7-debug.apk PS-PlayAnywhere-0.1.7-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PS PlayAnywhere 0.1.7 (Android debug)" --notes-file release-notes.md --latest
